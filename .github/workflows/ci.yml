name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package SinDisk.app
        run: ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SinDisk-app
          path: |
            build/SinDisk.zip
            build/SinDisk.zip.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/SinDisk.zip
            build/SinDisk.zip.sha256
